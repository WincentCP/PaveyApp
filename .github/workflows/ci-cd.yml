name: Pavey MLOps CI/CD Production Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v3

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt pytest flake8

    - name: Run Code Linter (Flake8 Check)
      run: |
        # Berhenti jika ada sintaks error Python atau kegagalan formatting kritis
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Execute Automated Unit Testing (Pytest)
      run: |
        python -m pytest

    - name: Build Local Verification Docker Image
      run: |
        docker build -t pavey-ai-core:latest .
